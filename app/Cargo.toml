[package]
name = "startide"
version = "0.1.0"
edition = "2021"
description = "StarTide - a calm home for your AI agent skills"
default-run = "startide"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
