<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>StarTide</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div class="titlebar">
    <div class="brand">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4fc3f7" stroke-width="2"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>
      StarTide
    </div>
    <div class="tools">
      <div class="tbtn" data-tip="扫描本机" data-cmd="scan"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></svg></div>
      <div class="tbtn" data-tip="同步" data-cmd="sync"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-8-5M3 12a9 9 0 0 1 9-9 9 9 0 0 1 8 5"/><path d="M21 3v5h-5M3 21v-5h5"/></svg></div>
      <div class="tbtn" data-tip="链接（预览）" data-cmd="link"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7L12.5 19"/></svg></div>
      <div class="tbtn" data-tip="清理（预览）" data-cmd="gc"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></svg></div>
      <div class="tbtn" data-tip="还原所有 agent 目录" data-cmd="unlink"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7v6h6"/><path d="M3.5 13a9 9 0 1 0 2-7.5L3 8"/></svg></div>
    </div>
  </div>

  <div class="topbar">
    <div class="search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="搜索技能…" autocomplete="off">
    </div>
    <div class="crumb" id="crumb"></div>
    <div class="tabs">
      <div class="tab on" data-t="all">全部</div>
      <div class="tab" data-t="in">已入库</div>
      <div class="tab" data-t="out">仅目录</div>
      <div class="vtoggle">
        <div class="vbtn on" data-v="grid" title="卡片视图"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></div>
        <div class="vbtn" data-v="list" title="列表视图"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg></div>
      </div>
    </div>
  </div>

  <div class="cols">
    <div class="agents" id="agents"></div>
    <div class="grid-wrap"><div class="grid" id="grid"></div></div>
    <div class="detail" id="detail"><div class="d-inner" id="d-inner"></div></div>
  </div>

  <div class="status">
    <span id="st">启动中…</span>
    <span class="right"><span id="st-scope">own</span><span>⌘K</span></span>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
