<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>StarTide</title>
<style>
  :root{
    --side:#252526; --edit:#1e1e1e; --card:#2d2d2f; --card-hover:#333336;
    --fg:#cccccc; --dim:#858585; --faint:#6a6a6a;
    --hover:#2a2d2e; --sel:#094771; --border:#007fd4; --line:#333;
    --badge:#4d4d4d; --accent:#007acc; --teal:#4fc3f7;
    --green:#89d185; --amber:#cca700;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#101114;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,"Segoe UI","PingFang SC",sans-serif;font-size:13px;
    color:var(--fg);-webkit-font-smoothing:antialiased}

  .app{width:1080px;height:660px;display:flex;flex-direction:column;
    background:var(--edit);border:1px solid #454545;border-radius:6px;overflow:hidden;
    box-shadow:0 22px 60px rgba(0,0,0,.6)}

  /* ===== 标题栏 ===== */
  .titlebar{height:35px;flex:none;display:flex;align-items:center;gap:8px;
    padding:0 8px 0 14px;background:#3c3c3c;border-bottom:1px solid var(--line)}
  .titlebar .brand{display:flex;align-items:center;gap:7px;font-size:11px;
    font-weight:700;letter-spacing:.08em;color:#e7e7e7;text-transform:uppercase}
  .tools{margin-left:auto;display:flex}
  .tbtn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    color:var(--fg);opacity:.85;cursor:pointer;border-radius:4px;position:relative}
  .tbtn:hover{background:#4a4a4a;opacity:1}
  .tbtn::after{content:attr(data-tip);position:absolute;top:30px;left:50%;transform:translateX(-50%);
    background:#252526;border:1px solid #454545;color:var(--fg);font-size:11px;
    padding:3px 8px;border-radius:3px;white-space:nowrap;opacity:0;pointer-events:none;transition:.1s;z-index:9}
  .tbtn:hover::after{opacity:1}

  /* ===== 搜索条 ===== */
  .topbar{height:40px;flex:none;display:flex;align-items:center;gap:10px;
    padding:0 12px;background:var(--side);border-bottom:1px solid var(--line)}
  .search{display:flex;align-items:center;gap:6px;height:26px;padding:0 8px;
    background:#3c3c3c;border-radius:2px;border:1px solid transparent;flex:1;max-width:440px}
  .search:focus-within{border-color:var(--border)}
  .search svg{flex:none;opacity:.6}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--fg);
    font-size:12.5px;font-family:inherit}
  .search input::placeholder{color:var(--faint)}
  .crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
  .crumb b{color:var(--fg);font-weight:600}
  .tabs{margin-left:auto;display:flex;gap:2px}
  .tab{height:22px;padding:0 10px;display:flex;align-items:center;border-radius:3px;
    font-size:11.5px;color:var(--dim);cursor:pointer;gap:5px}
  .tab:hover{background:var(--hover);color:var(--fg)}
  .tab.on{background:var(--sel);color:#fff}

  /* ===== 三栏 ===== */
  .cols{flex:1;display:flex;min-height:0}

  /* 左：agent 树 */
  .agents{width:208px;flex:none;background:var(--side);overflow-y:auto;padding-bottom:10px}
  .agents::-webkit-scrollbar{width:8px}
  .agents::-webkit-scrollbar-thumb{background:#424242}
  .grp{display:flex;align-items:center;gap:4px;height:24px;padding:0 10px;
    font-size:11px;font-weight:700;letter-spacing:.05em;color:#e0e0e0;
    cursor:pointer;user-select:none}
  .grp:hover{background:var(--hover)}
  .grp .cnt{font-size:10px;color:#fff;background:var(--badge);border-radius:8px;
    padding:1px 6px;line-height:13px}
  .arow{display:flex;align-items:center;gap:8px;height:26px;padding:0 10px 0 20px;
    cursor:pointer;user-select:none}
  .arow:hover{background:var(--hover)}
  .arow.sel{background:var(--sel)}
  .arow.sel .an,.arow.sel .ac{color:#fff}
  .adot{width:9px;height:9px;border-radius:50%;flex:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.08)}
  .an{flex:1;font-size:12.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ac{font-family:var(--mono);font-size:10px;color:var(--faint)}
  .asec{margin-top:6px;border-top:1px solid var(--line);padding-top:4px}

  /* 中：skill 卡片墙 */
  .grid-wrap{flex:1;min-width:0;overflow-y:auto;padding:12px}
  .grid-wrap::-webkit-scrollbar{width:8px}
  .grid-wrap::-webkit-scrollbar-thumb{background:#424242}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px}
  .card{background:var(--card);border:1px solid #38383a;border-radius:6px;
    padding:12px 12px 10px;cursor:pointer;position:relative;
    display:flex;flex-direction:column;gap:8px;transition:border-color .12s,background .12s}
  .card:hover{background:var(--card-hover);border-color:#4a4a50}
  .card.sel{border-color:var(--border);background:#25313d}
  .card.sel::after{content:"";position:absolute;right:8px;top:8px;width:7px;height:7px;
    border-radius:50%;background:var(--border)}
  .chead{display:flex;align-items:center;gap:9px}
  .glyph{width:34px;height:34px;flex:none;border-radius:7px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;color:#fff}
  .ct{min-width:0;flex:1}
  .cname{font-size:13px;font-weight:600;color:#e8e8e8;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmeta{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:3px;
    display:flex;gap:6px;align-items:center}
  .cst{padding:0 5px;border-radius:3px;line-height:14px;font-size:9px;font-weight:600}
  .cst.in{color:var(--green);background:rgba(137,209,133,.12)}
  .cst.out{color:var(--amber);background:rgba(204,167,0,.1)}
  .cdesc{font-size:11.5px;line-height:1.55;color:var(--dim);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    min-height:34px}
  .cfoot{display:flex;align-items:center;gap:6px;margin-top:auto}
  .dots{display:flex;gap:3px}
  .dots i{width:7px;height:7px;border-radius:50%;display:block}
  .csize{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)}
  .empty{grid-column:1/-1;padding:60px 0;text-align:center;color:var(--faint)}
  .empty .t{font-size:13px;color:var(--dim);margin-top:8px}

  /* 右：详情 */
  .detail{width:308px;flex:none;background:var(--side);border-left:1px solid var(--line);
    overflow-y:auto;display:flex;flex-direction:column}
  .detail::-webkit-scrollbar{width:8px}
  .detail::-webkit-scrollbar-thumb{background:#424242}
  .d-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;color:var(--faint)}
  .d-empty .t{font-size:12.5px;color:var(--dim)}
  .d-empty .k{font-family:var(--mono);font-size:10.5px}
  .d-head{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
  .d-kick{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .d-title{font-size:16px;font-weight:700;color:#eee;line-height:1.35;word-break:break-all}
  .d-desc{font-size:11.5px;line-height:1.65;color:var(--dim);margin-top:8px}
  .d-sec{padding:12px 16px;border-bottom:1px solid var(--line)}
  .d-lab{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--faint);
    text-transform:uppercase;margin-bottom:8px}
  .pillrow{display:flex;flex-wrap:wrap;gap:5px}
  .vp{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 9px;
    background:#2a2a2b;border:1px solid #3c3c3c;border-radius:3px;font-size:11px;color:var(--fg)}
  .vp i{width:6px;height:6px;border-radius:50%}
  .kv{display:flex;justify-content:space-between;align-items:center;height:24px}
  .kv b{font-size:11.5px;color:var(--dim);font-weight:400}
  .kv span{font-family:var(--mono);font-size:10.5px;color:var(--fg)}
  .srcrow{display:flex;align-items:center;gap:8px;height:26px;padding:0 4px;border-radius:3px}
  .srcrow:hover{background:var(--hover)}
  .srcrow code{flex:1;font-family:var(--mono);font-size:10px;color:var(--dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srcrow a{font-size:10.5px;color:#3794ff;cursor:pointer;text-decoration:none;flex:none}
  .srcrow a:hover{text-decoration:underline}

  /* 视图切换 */
  .vtoggle{display:flex;gap:2px;margin-left:8px}
  .vbtn{width:24px;height:22px;display:flex;align-items:center;justify-content:center;
    border-radius:3px;cursor:pointer;color:var(--dim)}
  .vbtn:hover{background:var(--hover);color:var(--fg)}
  .vbtn.on{background:var(--sel);color:#fff}

  /* 列表视图 */
  .rows{display:flex;flex-direction:column;gap:1px}
  .lrow{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;
    border-radius:4px;cursor:pointer;user-select:none}
  .lrow:hover{background:var(--card-hover)}
  .lrow.sel{background:#25313d;box-shadow:inset 0 0 0 1px var(--border)}
  .ldot{width:26px;height:26px;flex:none;border-radius:6px;display:flex;
    align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
  .lmid{flex:1;min-width:0}
  .lname{font-size:12.5px;font-weight:600;color:#e8e8e8;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .ldesc{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;margin-top:1px}
  .lright{display:flex;align-items:center;gap:10px;flex:none}
  .lright .dots i{width:7px;height:7px}
  .lsize{font-family:var(--mono);font-size:10px;color:var(--faint);width:50px;text-align:right}

  /* 弹出式详情 */
  .detail{width:0;transition:width .18s ease;overflow:hidden}
  .detail.open{width:308px}
  .d-close{position:absolute;right:8px;top:8px;width:22px;height:22px;display:flex;
    align-items:center;justify-content:center;border-radius:4px;cursor:pointer;
    color:var(--dim);z-index:2}
  .d-close:hover{background:var(--hover);color:var(--fg)}
  .d-inner{width:308px}

  /* 状态栏 */
  .status{height:22px;flex:none;background:var(--accent);color:#fff;display:flex;
    align-items:center;padding:0 10px;gap:12px;font-size:11px;user-select:none}
  .status .right{margin-left:auto;display:flex;gap:12px;font-family:var(--mono);font-size:10.5px}
</style>
</head>
<body>
<div class="app">

  <div class="titlebar">
    <div class="brand">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4fc3f7" stroke-width="2"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>
      StarTide
    </div>
    <div class="tools">
      <div class="tbtn" data-tip="扫描本机"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></svg></div>
      <div class="tbtn" data-tip="同步"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-8-5M3 12a9 9 0 0 1 9-9 9 9 0 0 1 8 5"/><path d="M21 3v5h-5M3 21v-5h5"/></svg></div>
      <div class="tbtn" data-tip="链接（预览）"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7L12.5 19"/></svg></div>
      <div class="tbtn" data-tip="清理（预览）"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></svg></div>
      <div class="tbtn" data-tip="还原"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7v6h6"/><path d="M3.5 13a9 9 0 1 0 2-7.5L3 8"/></svg></div>
    </div>
  </div>

  <div class="topbar">
    <div class="search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="搜索技能…" autocomplete="off">
    </div>
    <div class="crumb" id="crumb"></div>
    <div class="tabs">
      <div class="tab on" data-t="all">全部</div>
      <div class="tab" data-t="in">已入库</div>
      <div class="tab" data-t="out">仅目录</div>
      <div class="vtoggle">
        <div class="vbtn on" data-v="grid" title="卡片视图"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></div>
        <div class="vbtn" data-v="list" title="列表视图"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg></div>
      </div>
    </div>
  </div>

  <div class="cols">
    <div class="agents" id="agents"></div>
    <div class="grid-wrap"><div class="grid" id="grid"></div></div>
    <div class="detail" id="detail"><div class="d-inner" id="d-inner"></div></div>
  </div>

  <div class="status">
    <span id="st">skillctl</span>
    <span class="right"><span id="st-scope">own</span><span>⌘K</span></div>
  </div>
</div>

<script src="data.js"></script>
<script>
const AC=['','#2f7dd1','#3d9a5f','#c98a2e','#c25b7c','#2f9a8f','#d0713f','#4a6fa5','#7c8fa6','#b05a5a','#2f8f8a'];
const HUES=[210,145,38,340,172,24,222,205,2,176];
const agents=DATA.agents;
const aColor=id=>{const i=agents.findIndex(a=>a.id===id);return i<0?'#666':AC[(i+1)%AC.length]};
const hue=id=>{const i=agents.findIndex(a=>a.id===id);return i<0?210:HUES[(i+1)%HUES.length]};
const aLabel=id=>(agents.find(a=>a.id===id)||{}).label||id;
const fmt=b=>b>1048576?(b/1048576).toFixed(1)+' MB':b>1024?(b/1024).toFixed(1)+' KB':b+' B';
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

const S={q:'',agent:null,tab:'all',sel:null,view:'grid'};

function vis(){
  const q=S.q.toLowerCase();
  return DATA.skills.filter(s=>
    (!q||s.name.toLowerCase().includes(q)||(s.description||'').toLowerCase().includes(q))&&
    (!S.agent||s.agents.includes(S.agent))&&
    (S.tab==='all'||(S.tab==='in')===s.stored));
}

/* ===== 左栏 agent 树 ===== */
function renderAgents(){
  const v=vis();
  let h=`<div class="grp">AGENTS <span class="cnt">${agents.length}</span></div>`;
  h+=`<div class="arow ${!S.agent?'sel':''}" data-a="">
    <span class="adot" style="background:#4fc3f7"></span>
    <span class="an">全部</span><span class="ac">${v.length}</span></div>`;
  agents.forEach(a=>{
    const n=v.filter(s=>s.agents.includes(a.id)).length;
    h+=`<div class="arow ${S.agent===a.id?'sel':''}" data-a="${a.id}">
      <span class="adot" style="background:${aColor(a.id)}"></span>
      <span class="an">${a.label}</span><span class="ac">${n}</span></div>`;
  });
  document.getElementById('agents').innerHTML=h;
  document.querySelectorAll('.arow[data-a]').forEach(r=>r.onclick=()=>{
    S.agent=r.dataset.a||null;S.sel=null;renderAll();
  });
}

/* ===== 中间：卡片 / 列表 ===== */
function renderCards(v){
  const g=document.getElementById('grid');
  g.className='grid';
  if(!v.length){g.innerHTML=`<div class="empty"><div class="t">没有匹配的技能</div></div>`;return;}
  g.innerHTML=v.map((s,i)=>{
    const key=S.agent||s.agents[0]||'x';
    const gcol=`linear-gradient(135deg,hsl(${hue(key)} 42% 42%),hsl(${hue(key)} 48% 30%))`;
    const dots=agents.slice(0,5).map(a=>`<i style="background:${s.agents.includes(a.id)?aColor(a.id):'#3a3a3a'}" title="${aLabel(a)}"></i>`).join('');
    return `<div class="card ${S.sel===i?'sel':''}" data-i="${i}">
      <div class="chead">
        <div class="glyph" style="background:${gcol}">${esc(s.name[0]||'?').toUpperCase()}</div>
        <div class="ct">
          <div class="cname">${esc(s.name)}</div>
          <div class="cmeta"><span class="cst ${s.stored?'in':'out'}">${s.stored?'已入库':'仅目录'}</span><span>${s.agents.length} agent</span></div>
        </div>
      </div>
      <div class="cdesc">${esc(s.description)}</div>
      <div class="cfoot"><div class="dots">${dots}</div><span class="csize">${fmt(s.size)}</span></div>
    </div>`;
  }).join('');
  g.querySelectorAll('.card').forEach(c=>c.onclick=()=>{S.sel=+c.dataset.i;renderAll();
    const el=g.querySelector('.card.sel');if(el)el.scrollIntoView({block:'nearest'});});
}

/* 列表视图：紧凑行，归属点阵保留 */
function renderList(v){
  const g=document.getElementById('grid');
  g.className='rows';
  if(!v.length){g.innerHTML=`<div class="empty"><div class="t">没有匹配的技能</div></div>`;return;}
  g.innerHTML=v.map((s,i)=>{
    const key=s.agents[0]||'x';
    const gcol=`linear-gradient(135deg,hsl(${hue(key)} 42% 42%),hsl(${hue(key)} 48% 30%))`;
    const dots=agents.slice(0,5).map(a=>`<i style="background:${s.agents.includes(a.id)?aColor(a.id):'#3a3a3a'}" title="${aLabel(a)}"></i>`).join('');
    return `<div class="lrow ${S.sel===i?'sel':''}" data-i="${i}">
      <div class="ldot" style="background:${gcol}">${esc(s.name[0]||'?').toUpperCase()}</div>
      <div class="lmid">
        <div class="lname">${esc(s.name)}</div>
        <div class="ldesc">${esc(s.description)}</div>
      </div>
      <div class="lright">
        <div class="dots">${dots}</div>
        <span class="lsize">${fmt(s.size)}</span>
        <span class="cst ${s.stored?'in':'out'}">${s.stored?'已入库':'仅目录'}</span>
      </div>
    </div>`;
  }).join('');
  g.querySelectorAll('.lrow').forEach(r=>r.onclick=()=>{S.sel=+r.dataset.i;renderAll();
    const el=g.querySelector('.lrow.sel');if(el)el.scrollIntoView({block:'nearest'});});
}

function renderGrid(){
  const v=vis();
  document.getElementById('crumb').innerHTML=
    `${S.agent?`<b style="color:${aColor(S.agent)}">●</b>&nbsp;<b>${aLabel(S.agent)}</b><span>·</span>`:''}<b>${v.length}</b> 个技能`;
  if(S.view==='list'){renderList(v);}else{renderCards(v);}
}

/* ===== 右侧详情 ===== */
function renderDetail(){
  const d=document.getElementById('detail'),inner=document.getElementById('d-inner'),s=vis()[S.sel];
  d.classList.toggle('open',!!s);
  if(!s){inner.innerHTML='';return;}
  inner.innerHTML=`
    <div class="d-close" onclick="closeDetail()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></div>`;
  const pills=s.agents.length?s.agents.map(a=>`<span class="vp"><i style="background:${aColor(a)}"></i>${aLabel(a)}</span>`).join('')
    :`<span style="font-size:11px;color:var(--faint)">仅 scope=all 时可见</span>`;
  const srcs=s.sources.slice(0,4).map(p=>`<div class="srcrow"><code title="${esc(p)}">${esc(p)}</code><a>复制</a><a>显示</a></div>`).join('');
  d.innerHTML=`
    <div class="d-head">
      <div class="d-kick">
        <span class="cst ${s.stored?'in':'out'}" style="font-size:10px;padding:2px 8px">${s.stored?'已入库':'仅目录'}</span>
        <span style="font-family:var(--mono);font-size:10px;color:var(--faint)">${s.id.slice(0,10)}…</span>
      </div>
      <div class="d-title">${esc(s.name)}</div>
      <div class="d-desc">${esc(s.description)||'暂无描述'}</div>
    </div>
    <div class="d-sec"><div class="d-lab">可见 agent</div><div class="pillrow">${pills}</div></div>
    <div class="d-sec"><div class="d-lab">元信息</div>
      <div class="kv"><b>大小</b><span>${fmt(s.size)}</span></div>
      <div class="kv"><b>磁盘副本</b><span>${s.sources.length} 份</span></div>
      <div class="kv"><b>哈希</b><span>${s.id.slice(0,16)}</span></div>
    </div>
    <div class="d-sec"><div class="d-lab">来源位置</div>${srcs}</div>`;
}

function renderAll(){
  renderAgents();renderGrid();renderDetail();
  document.getElementById('st').textContent=
    `skillctl · ${vis().length} 技能 · ${agents.length} agent`;
  document.getElementById('st-scope').textContent=
    `${S.tab==='all'?'全部':S.tab==='in'?'已入库':'仅目录'}${S.agent?' · '+aLabel(S.agent):''}`;
}

document.getElementById('q').oninput=e=>{S.q=e.target.value;S.sel=null;renderAll()};
document.querySelectorAll('.vbtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.vbtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');S.view=b.dataset.v;renderAll();
});
function closeDetail(){S.sel=null;renderAll();}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');S.tab=t.dataset.t;S.sel=null;renderAll();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){document.getElementById('q').value='';S.q='';S.sel=null;renderAll();}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();const v=vis();if(!v.length)return;
    const cur=S.sel==null?-1:S.sel;
    S.sel=e.key==='ArrowDown'?Math.min(cur+1,v.length-1):Math.max(cur-1,0);
    renderAll();
    const el=document.querySelector('.card.sel');if(el)el.scrollIntoView({block:'nearest'});
  }
});

renderAll();
</script>
</body>
</html>
